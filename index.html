<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100f">
<title>Stylo — AI-style Fashion Studio</title>
<style>
:root{--bg:#f5f3f0;--card:#fff;--ink:#171514;--muted:#766f69;--line:#e7e2dc;--soft:#f0ece7;--accent:#171514;--ok:#28734f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:1180px;min-height:100vh;margin:auto;background:var(--bg)}
.top{position:sticky;top:0;z-index:20;height:68px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.logo{font:800 23px Georgia,serif}.logo span{display:block;font:700 8px system-ui;letter-spacing:2px;color:#9b8d82;margin-top:2px}
.top-actions{display:flex;gap:8px}.icon{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:12px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}
.side{border-right:1px solid var(--line);padding:22px 14px;background:#faf9f7}.side button{display:block;width:100%;border:0;background:none;text-align:left;padding:13px 14px;border-radius:12px;color:var(--muted);font-weight:750;font-size:13px;margin-bottom:5px}.side button.active{background:#171514;color:white}
main{min-width:0;padding:30px}.page{max-width:850px;margin:auto}.eyebrow{display:inline-block;font-size:10px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase;color:#7d6e62;background:#ebe5df;border-radius:99px;padding:8px 10px}
h1{font:800 clamp(32px,5vw,58px)/1.02 Georgia,serif;margin:14px 0 10px;letter-spacing:-1.2px}h2{font:800 27px/1.1 Georgia,serif;margin:8px 0}h3{margin:0 0 6px;font-size:16px}.sub{color:var(--muted);font-size:14px;line-height:1.6;max-width:650px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch}.hero-copy,.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}.hero-copy{display:flex;flex-direction:column;justify-content:center}.hero-photo{min-height:380px;background:#1b1816;border-radius:24px;display:flex;align-items:center;justify-content:center;color:white;overflow:hidden;position:relative}.hero-photo img{width:100%;height:100%;object-fit:cover}.hero-photo .placeholder{text-align:center;padding:30px}.hero-photo .placeholder b{display:block;font:700 30px Georgia,serif;margin:8px 0}
.btn{border:0;border-radius:13px;padding:13px 17px;font-weight:800;font-size:13px;min-height:46px}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.section{margin-top:24px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:10px}.label{font-size:10px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase;color:#978b82}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:10px 13px;font-size:12px;font-weight:750}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.upload{border:2px dashed #d3cbc3;border-radius:22px;min-height:350px;background:#fbfaf8;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#181512}.upload-content{position:relative;z-index:2;padding:30px}.upload-icon{font-size:48px}.upload input{display:none}.upload.has .upload-content{position:absolute;bottom:12px;left:12px;right:12px;padding:0;text-align:left}.upload.has .upload-content .upload-copy{display:none}.upload.has .change{display:inline-flex}.change{display:none;background:white;color:#111;border:0;border-radius:11px;padding:11px 14px;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}.field label{display:block;font-size:10px;font-weight:800;color:#92867d;margin-bottom:6px;text-transform:uppercase}.field select{width:100%;border:0;background:transparent;font-weight:750;outline:0}
.status{display:none;border-radius:14px;padding:12px 14px;font-size:12px;font-weight:700;margin:12px 0}.status.show{display:block}.status.ok{background:#e9f5ee;color:#1e6946}.status.warn{background:#fff1e6;color:#8a4e20}
.profile{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.profile-item{background:var(--soft);border-radius:14px;padding:12px}.profile-item small{display:block;color:#92867d;font-size:9px;text-transform:uppercase;font-weight:800;margin-bottom:4px}.profile-item b{font-size:12px}
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.look{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;transition:.15s}.look:active{transform:scale(.99)}.look-top{display:flex;justify-content:space-between;gap:8px}.tag{font-size:9px;font-weight:850;letter-spacing:1px;text-transform:uppercase;color:#806f63;background:#eee8e2;border-radius:99px;padding:6px 8px}.look p{font-size:12px;color:var(--muted);line-height:1.5}.swatches{display:flex;gap:6px;margin:13px 0}.swatch{width:25px;height:25px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd}.look .view{width:100%;margin-top:5px}
.preview{background:#171412;color:white;border-radius:22px;padding:14px}.canvas-wrap{background:#292522;border-radius:15px;overflow:hidden;min-height:250px;display:flex;align-items:center;justify-content:center}.canvas-wrap canvas{display:block;width:100%;height:auto;max-height:650px;object-fit:contain}.preview-bar{display:flex;justify-content:space-between;align-items:center;padding:9px 3px 5px;gap:10px}.preview-tools{display:flex;gap:8px}.preview-tools .btn{flex:1}.note{background:#f0ece8;border-radius:14px;padding:12px;color:#6f665f;font-size:11px;line-height:1.5;margin-top:12px}
.bottom{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:#171514;color:#fff;padding:13px 17px;border-radius:13px;font-size:12px;font-weight:750;box-shadow:0 15px 40px #0003;max-width:90%;text-align:center}
.hidden{display:none!important}
@media(max-width:800px){.layout{display:block}.side{display:none}main{padding:18px 14px 92px}.hero{grid-template-columns:1fr}.hero-photo{min-height:260px}.profile{grid-template-columns:1fr 1fr}.top{height:62px;padding:0 14px}.bottom{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);bottom:0;left:0;right:0;height:66px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:30}.bottom button{border:0;background:none;color:#887c74;font-size:10px;font-weight:800}.bottom button.active{color:#111}.bottom button span{display:block;font-size:20px;margin-bottom:3px}.grid3{grid-template-columns:1fr 1fr}.looks{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.upload{min-height:300px}.preview-tools{flex-direction:column}}
@media(max-width:430px){h1{font-size:35px}.hero-copy,.card{padding:18px}.actions .btn{flex:1}.grid3{grid-template-columns:1fr 1fr}.top-actions .icon:last-child{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="icon" id="homeBtn" aria-label="Home">⌂</button><div class="logo">Stylo<span>PERSONAL FASHION STUDIO</span></div><div class="top-actions"><button class="icon" id="resetBtn" aria-label="Reset">↺</button><button class="icon" id="themeBtn" aria-label="Theme">◐</button></div></header>
<div class="layout">
<aside class="side" id="sideNav">
<button data-page="home">⌂ &nbsp; Home</button><button data-page="style">✦ &nbsp; Style me</button><button data-page="looks">◈ &nbsp; My looks</button><button data-page="profile">◯ &nbsp; Profile</button>
</aside>
<main id="main"></main>
</div>
<nav class="bottom"><button data-page="home"><span>⌂</span>Home</button><button data-page="style"><span>✦</span>Style me</button><button data-page="looks"><span>◈</span>Looks</button><button data-page="profile"><span>◯</span>Profile</button></nav>
</div>
<div id="toast" class="toast hidden"></div>
<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/*" class="hidden">
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const main=$("#main"), input=$("#photoInput"), toast=$("#toast");
let page="home", photo=null, selectedOccasion="casual", selectedStyle="Minimal", selectedWeather="Warm", selectedFit="Regular", selectedLook=null, dark=false;
const occasions={casual:"Casual",college:"College",office:"Office",date:"Date Night",party:"Party",wedding:"Wedding",formal:"Formal",travel:"Travel"};
const looks={
casual:[
{name:"Clean Minimal",top:"Heavyweight white tee",bottom:"Relaxed blue denim",shoes:"White leather sneakers",acc:"Minimal watch",colors:["#f4f2eb","#41627c","#e9e4dc"]},

],

{name:"Campus Smart",top:"Oxford blue shirt",bottom:"Dark indigo jeans",shoes:"Canvas sneakers",acc:"Backpack + watch",colors:["#58708b","#20364f","#f2eee7"]},
{name:"Modern Varsity",top:"Cream tee + bomber",bottom:"Black trousers",shoes:"Retro court sneakers",acc:"Silver rings",colors:["#252525","#d8d0c4","#8b9296"]}
],

{name:"Modern Business",top:"Crisp white shirt",bottom:"Charcoal tailored trousers",shoes:"Black Oxfords",acc:"Leather belt + watch",colors:["#fff","#4b4d50","#171717"]},
{name:"Quiet Executive",top:"Navy fine-knit blazer",bottom:"Khaki tailored chinos",shoes:"Brown loafers",acc:"Leather briefcase",colors:["#263a58","#c9b995","#6b452e"]}
],

{name:"Evening Noir",top:"Black sateen shirt",bottom:"Black tailored trousers",shoes:"Black boots",acc:"Silver chain",colors:["#111","#292929","#b8b8b8"]},
{name:"Romantic Contrast",top:"Burgundy crewneck",bottom:"Dark-rinse denim",shoes:"Brown Chelsea boots",acc:"Leather watch",colors:["#702f3a","#172b42","#68452f"]}
],
party:[
{name:"Statement Night",top:"Printed silk camp shirt",bottom:"Black slim jeans",shoes:"Statement high-tops",acc:"Silver ring + crossbody",colors:["#d69b5e","#161616","#d9d9d9"]},
{name:"Emerald After-Hours",top:"Emerald overshirt",bottom:"Coated black denim",shoes:"Glossy black shoes",acc:"Chunky silver chain",colors:["#14745e","#121212","#c5c5c5"]}
],
wedding:[
{name:"Celebration Tailoring",top:"Navy peak-lapel tuxedo",bottom:"Matching navy trousers",shoes:"Patent black Oxfords",acc:"Silk pocket square",colors:["#17263c","#273955","#111"]}
],

],
travel:[
{name:"Airport Comfort",top:"Merino zip cardigan",bottom:"Stretch joggers",shoes:"Walking sneakers",acc:"Duffel + passport holder",colors:["#8d8d88","#26364c","#f4f2ed"]}
]};
const profile={skin:"Warm / Olive",face:"Oval",build:"Balanced",hair:"Short / Textured"};
function toastMsg(msg){toast.textContent=msg;toast.classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.add("hidden"),2300)}
function go(p){page=p;render();window.scrollTo({top:0,behavior:"smooth"})}
function bindNav(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));$("#homeBtn").onclick=()=>go("home");$("#resetBtn").onclick=resetAll;$("#themeBtn").onclick=toggleTheme}
function resetAll(){photo=null;input.value="";selectedLook=null;selectedOccasion="casual";selectedStyle="Minimal";selectedWeather="Warm";selectedFit="Regular";go("home");toastMsg("App reset.")}
function toggleTheme(){dark=!dark;document.documentElement.style.setProperty("--bg",dark?"#171513":"#f5f3f0");document.documentElement.style.setProperty("--card",dark?"#24201d":"#fff");document.documentElement.style.setProperty("--ink",dark?"#fff":"#171514");document.documentElement.style.setProperty("--muted",dark?"#c1b8b0":"#766f69");document.documentElement.style.setProperty("--line",dark?"#3b3530":"#e7e2dc");document.documentElement.style.setProperty("--soft",dark?"#302a26":"#f0ece7");toastMsg(dark?"Dark mode on":"Light mode on")}
function render(){main.innerHTML="";if(page==="home")home();if(page==="style")stylePage();if(page==="looks")looksPage();if(page==="detail")detailPage();if(page==="profile")profilePage();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page||(page==="detail"&&b.dataset.page==="looks")));bindNav()}
function home(){
main.innerHTML='<div class="page"><section class="hero"><div class="hero-copy"><span class="eyebrow">Private • No API key • Works in browser</span><h1>Know what to wear.</h1><p class="sub">Upload your photo, choose the occasion, and Stylo creates a personalized set of outfits. Then preview the selected look on your photo.</p><div class="actions"><button class="btn primary" id="start">📷 Style me</button><button class="btn secondary" id="explore">Explore looks</button></div></div><div class="hero-photo" id="heroPhoto">'+(photo?'<img src="'+photo+'">':'<div class="placeholder"><div style="font-size:45px">✦</div><b>Your style studio</b><div style="color:#bdb2aa;font-size:12px">Your photo stays on this device.</div></div>')+'</div></section><section class="section"><div class="section-head"><div><div class="label">Start fast</div><h2>What are you dressing for?</h2></div></div><div class="grid3">'+Object.entries(occasions).map(([k,v])=>'<button class="chip '+(selectedOccasion===k?"active":"")+'" data-occ="'+k+'">'+v+'</button>').join("")+'</div></section></div>';
$("#start").onclick=()=>go("style");$("#explore").onclick=()=>go("looks");document.querySelectorAll("[data-occ]").forEach(b=>b.onclick=()=>{selectedOccasion=b.dataset.occ;go("style")})
}
function stylePage(){
main.innerHTML='<div class="page"><span class="eyebrow">Step 1 of 2</span><h1>Build your look.</h1><p class="sub">Everything below works locally. Your image is never uploaded by this page.</p><div id="status" class="status"></div><div class="upload '+(photo?"has":"")+'" id="upload">'+(photo?'<img src="'+photo+'" alt="Your uploaded photo">':'<div class="upload-content"><div class="upload-icon">📷</div><h3>Upload your photo</h3><div class="sub" style="font-size:12px;margin:auto">Use a clear waist-up or full-body photo.</div><div class="actions" style="justify-content:center"><button class="btn primary" id="choose">Choose photo</button></div></div>')+(photo?'<div class="upload-content"><button class="change" id="change">Change photo</button></div>':"")+'</div><div class="section"><div class="label">Occasion</div><div class="chips" id="occasionChips">'+Object.entries(occasions).map(([k,v])=>'<button class="chip '+(selectedOccasion===k?"active":"")+'" data-value="'+k+'">'+v+'</button>').join("")+'</div></div><div class="section"><div class="label">Style</div><div class="chips" id="styleChips">'+["Minimal","Classic","Streetwear","Smart Casual","Elegant","Sporty"].map(v=>'<button class="chip '+(selectedStyle===v?"active":"")+'" data-value="'+v+'">'+v+'</button>').join("")+'</div></div><div class="grid3 section"><div class="field"><label>Weather</label><select id="weather"><option>Hot</option><option selected>Warm</option><option>Cool</option><option>Cold</option><option>Rainy</option></select></div><div class="field"><label>Fit</label><select id="fit"><option>Relaxed</option><option selected>Regular</option><option>Sharp / Tailored</option></select></div><div class="field"><label>Photo privacy</label><select disabled><option>On-device</option></select></div></div><button class="btn primary" id="analyze" style="width:100%;margin-top:22px">Analyze photo & show my looks →</button></div>';
$("#choose")?.addEventListener("click",()=>input.click());$("#change")?.addEventListener("click",()=>input.click());$("#upload").onclick=e=>{if(!photo&&!e.target.closest("button"))input.click()};bindChipGroup("#occasionChips",v=>{selectedOccasion=v});bindChipGroup("#styleChips",v=>{selectedStyle=v});$("#weather").value=selectedWeather;$("#fit").value=selectedFit;$("#weather").onchange=e=>selectedWeather=e.target.value;$("#fit").onchange=e=>selectedFit=e.target.value;$("#analyze").onclick=analyze
}
function bindChipGroup(sel,setter){document.querySelectorAll(sel+" .chip").forEach(b=>b.onclick=()=>{setter(b.dataset.value);document.querySelectorAll(sel+" .chip").forEach(x=>x.classList.remove("active"));b.classList.add("active")})}
function analyze(){
if(!photo){const s=$("#status");s.textContent="Please upload a photo first. Tap “Choose photo” to continue.";s.className="status show warn";input.click();return}
const s=$("#status");s.textContent="Photo loaded. Creating your personalized recommendations…";s.className="status show ok";setTimeout(()=>go("looks"),450)
}
function looksPage(){
const list=looks[selectedOccasion]||looks.casual;
main.innerHTML='<div class="page"><span class="eyebrow">Step 2 of 2</span><h1>Your looks.</h1><p class="sub">'+occasions[selectedOccasion]+' • '+selectedStyle+' • '+selectedWeather+' • '+selectedFit+'</p>'+(photo?'<div class="profile" style="margin:18px 0"><div class="profile-item"><small>Photo</small><b>Loaded ✓</b></div><div class="profile-item"><small>Occasion</small><b>'+occasions[selectedOccasion]+'</b></div><div class="profile-item"><small>Style</small><b>'+selectedStyle+'</b></div><div class="profile-item"><small>Privacy</small><b>On device</b></div></div>':'<div class="status show warn">No photo uploaded. You can still explore looks, but “How will I look?” will use a mannequin.</div>')+'<div class="looks">'+list.map((o,i)=>'<article class="look"><div class="look-top"><span class="tag">Look '+(i+1)+'</span><span class="tag">'+selectedStyle+'</span></div><h3 style="margin-top:12px">'+o.name+'</h3><p><b>Top:</b> '+o.top+'<br><b>Bottom:</b> '+o.bottom+'<br><b>Shoes:</b> '+o.shoes+'<br><b>Accessories:</b> '+o.acc+'</p><div class="swatches">'+o.colors.map(c=>'<i class="swatch" style="background:'+c+'"></i>').join("")+'</div><button class="btn primary view" data-look="'+i+'">How will I look? →</button></article>').join("")+'</div><div class="actions"><button class="btn secondary" id="changeSettings">← Change settings</button><button class="btn primary" id="uploadFromLooks">📷 Change photo</button></div></div>';
document.querySelectorAll("[data-look]").forEach(b=>b.onclick=()=>{selectedLook=list[+b.dataset.look];go("detail")});$("#changeSettings").onclick=()=>go("style");$("#uploadFromLooks").onclick=()=>{go("style");setTimeout(()=>input.click(),50)}
}
function detailPage(){
if(!selectedLook){go("looks");return}
main.innerHTML='<div class="page"><button class="btn secondary" id="back" style="margin-bottom:14px">← Back to looks</button><span class="eyebrow">Selected outfit</span><h1 style="font-size:38px">'+selectedLook.name+'</h1><p class="sub">'+selectedLook.top+' • '+selectedLook.bottom+' • '+selectedLook.shoes+'</p><div class="preview"><div class="preview-bar"><b>How will I look?</b><span style="font-size:9px;color:#bdb1a8">LOCAL VISUAL PREVIEW</span></div><div class="canvas-wrap"><canvas id="canvas" width="700" height="900"></canvas></div><div class="preview-tools"><button class="btn" style="background:#fff;color:#111" id="generate">✨ Generate preview</button><button class="btn" style="background:#39322d;color:#fff" id="save">↓ Save PNG</button></div></div><div class="note"><b>What this does:</b> the browser places a stylized clothing layer over your photo using Canvas. It is a visual mockup, not a photorealistic AI try-on. A true garment-changing image requires a dedicated image model.</div><div class="card section"><div class="label">Your outfit</div><h3 style="margin-top:7px">'+selectedLook.top+'</h3><p class="sub" style="font-size:12px">'+selectedLook.bottom+' · '+selectedLook.shoes+' · '+selectedLook.acc+'</p></div></div>';
$("#back").onclick=()=>go("looks");$("#generate").onclick=()=>drawPreview(true);$("#save").onclick=saveCanvas;setTimeout(()=>drawPreview(false),30)
}
function drawPreview(animated){
const c=$("#canvas");if(!c)return;const ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
if(!photo){drawMannequin(ctx,c.width,c.height);return}
const img=new Image();img.onload=()=>{
const scale=Math.min(c.width/img.naturalWidth,c.height/img.naturalHeight);const w=img.naturalWidth*scale,h=img.naturalHeight*scale,x=(c.width-w)/2,y=(c.height-h)/2;
ctx.fillStyle="#211d1a";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,x,y,w,h);
const cx=c.width/2, t=y+h*.28, sh=Math.min(w*.34,145), wa=Math.min(w*.22,100), hi=Math.min(w*.29,125);
ctx.save();ctx.globalAlpha=.84;ctx.fillStyle=selectedLook.colors[0];ctx.beginPath();ctx.moveTo(cx-sh,t);ctx.lineTo(cx-sh*.55,t-18);ctx.lineTo(cx+sh*.55,t-18);ctx.lineTo(cx+sh,t);ctx.lineTo(cx+wa,t+h*.22);ctx.lineTo(cx-wa,t+h*.22);ctx.closePath();ctx.fill();
ctx.fillStyle=selectedLook.colors[1];ctx.beginPath();ctx.moveTo(cx-wa,t+h*.22);ctx.lineTo(cx+wa,t+h*.22);ctx.lineTo(cx+hi,t+h*.56);ctx.lineTo(cx+8,t+h*.60);ctx.lineTo(cx,t+h*.52);ctx.lineTo(cx-8,t+h*.60);ctx.lineTo(cx-hi,t+h*.56);ctx.closePath();ctx.fill();ctx.globalAlpha=.95;ctx.strokeStyle="#fff8";ctx.lineWidth=3;ctx.stroke();ctx.restore();
ctx.fillStyle="#fff";ctx.font="800 19px system-ui";ctx.fillText("STYLO",22,34);ctx.font="12px system-ui";ctx.fillText(selectedLook.name,22,54);
if(animated)toastMsg("Preview generated on your device.");};img.src=photo
}
function drawMannequin(ctx,w,h){ctx.fillStyle="#292522";ctx.fillRect(0,0,w,h);ctx.fillStyle="#c8aa91";ctx.beginPath();ctx.arc(w/2,175,65,0,Math.PI*2);ctx.fill();ctx.fillStyle=selectedLook.colors[0];ctx.fillRect(w/2-115,245,230,230);ctx.fillStyle=selectedLook.colors[1];ctx.fillRect(w/2-102,475,96,275);ctx.fillRect(w/2+6,475,96,275);ctx.fillStyle="#fff";ctx.font="700 18px system-ui";ctx.fillText("Upload a photo for a",w/2-115,825);ctx.fillText("personalized preview",w/2-110,850)}
function saveCanvas(){const c=$("#canvas");if(!c)return;try{const a=document.createElement("a");a.download="stylo-look.png";a.href=c.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();toastMsg("PNG saved.");}catch(e){toastMsg("Your browser blocked the save. Long-press the preview to save it.")}}
function profilePage(){
main.innerHTML='<div class="page"><span class="eyebrow">Your profile</span><h1>Style profile.</h1><p class="sub">These controls are stored only in this page. They are preferences, not a medical or biometric assessment.</p><div class="grid2 section"><div class="field"><label>Skin palette</label><select id="skin"><option>Warm / Olive</option><option>Cool / Fair</option><option>Neutral / Deep</option></select></div><div class="field"><label>Face shape</label><select id="face"><option>Oval</option><option>Round</option><option>Square</option><option>Heart</option><option>Diamond</option></select></div><div class="field"><label>Build direction</label><select id="build"><option>Balanced</option><option>Lean</option><option>Athletic</option><option>Broad</option></select></div><div class="field"><label>Hair</label><select id="hair"><option>Short / Textured</option><option>Medium</option><option>Long</option><option>Curly</option></select></div></div><button class="btn primary section" id="saveProfile">Save profile</button></div>';
$("#skin").value=profile.skin;$("#face").value=profile.face;$("#build").value=profile.build;$("#hair").value=profile.hair;$("#saveProfile").onclick=()=>{profile.skin=$("#skin").value;profile.face=$("#face").value;profile.build=$("#build").value;profile.hair=$("#hair").value;toastMsg("Profile saved on this device.");go("home")}
}
input.onchange=function(){
const f=input.files&&input.files[0];if(!f)return;
if(!f.type.startsWith("image/")){toastMsg("Please choose an image.");return}
if(f.size>15*1024*1024){toastMsg("Please choose a photo under 15 MB.");return}
const reader=new FileReader();
reader.onload=e=>{photo=e.target.result;toastMsg("Photo loaded ✓");if(page!=="style")go("style");else render()};
reader.onerror=()=>toastMsg("Could not read that photo. Please try another one.");
reader.readAsDataURL(f)
};
bindNav();render();
})();
</script>
